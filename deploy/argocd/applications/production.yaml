apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saas-production
  namespace: argocd
spec:
  project: saas-boilerplate
  source:
    repoURL: https://github.com/Khalil-Bchir/full-stack-saas-boilerplate.git
    targetRevision: main
    path: deploy/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: saas-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
