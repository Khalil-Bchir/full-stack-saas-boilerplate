name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.12.4'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/khalil-bchir/saas-boilerplate-api
  APP_IMAGE: ghcr.io/khalil-bchir/saas-boilerplate-app

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      HUSKY: '0'
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      ACCESS_TOKEN_TTL: 1d
      COOKIE_SECRET: ci-cookie-secret
      SERVER_PORT: '8000'
      SERVER_HOST: localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=production" >> "$GITHUB_OUTPUT"
            echo "NEXT_PUBLIC_API_URL=https://api.saas-boilerplate.io/api/v1" >> "$GITHUB_ENV"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
            echo "NEXT_PUBLIC_API_URL=https://api.staging.saas-boilerplate.io/api/v1" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
