apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: saas-production

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
  - target:
      kind: Deployment
      name: saas-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: saas-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: saas-boilerplate-api
    newName: ghcr.io/khalil-bchir/saas-boilerplate-api
    newTag: production
  - name: saas-boilerplate-app
    newName: ghcr.io/khalil-bchir/saas-boilerplate-app
    newTag: production
