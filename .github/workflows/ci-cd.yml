name: CI/CD Pipeline

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_REGISTRY_USER }}/blockchainbuilder_staging:api -f apps/api/Dockerfile .
          docker push ${{ secrets.DOCKER_REGISTRY_USER }}/blockchainbuilder_staging:api

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.TEST_KEY }}

      - name: Deploy to Azure
        run: |
          echo "Deploying to Azure..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_SSH_USER }}@${{ secrets.TEST_VM_IP }} "
            docker-compose down &&
            docker system prune -a -f &&
            docker-compose up -d &&
            docker-compose exec -T api sh -c \"
              cd packages/database && 
              npx prisma migrate deploy &&
            \""
