apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-api
  labels:
    app.kubernetes.io/name: saas-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-api
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: saas-boilerplate-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: saas-api-env
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
