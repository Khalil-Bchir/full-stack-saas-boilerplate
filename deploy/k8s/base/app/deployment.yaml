apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-app
  labels:
    app.kubernetes.io/name: saas-app
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-app
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: app
          image: saas-boilerplate-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: saas-app-env
                  key: NEXT_PUBLIC_API_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
