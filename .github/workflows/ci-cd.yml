name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.12.4'
  NODE_VERSION: '22'
  API_IMAGE: ${{ secrets.DOCKER_REGISTRY_USER }}/saas-boilerplate-api

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy-api:
    name: Deploy API (staging)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Pull image and restart API
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          IMAGE: ${{ env.API_IMAGE }}:staging
        run: |
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" bash -s "${IMAGE}" << 'EOF'
            set -euo pipefail
            IMAGE="$1"
            docker pull "${IMAGE}"
            docker stop saas-api 2>/dev/null || true
            docker rm saas-api 2>/dev/null || true
            docker run -d \
              --name saas-api \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /opt/saas-boilerplate/.env.production \
              "${IMAGE}"
            docker exec saas-api sh -c "cd packages/database && npx prisma migrate deploy"
          EOF
