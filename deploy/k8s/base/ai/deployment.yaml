apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-ai
  labels:
    app.kubernetes.io/name: saas-ai
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-ai
        app.kubernetes.io/component: ai
    spec:
      containers:
        - name: ai
          image: saas-boilerplate-ai:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: saas-ai-env
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
